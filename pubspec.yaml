name: voicetext
description: "Audio transcription and translation with your own Gemini API key."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  record: ^7.1.2
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
flutter:
  uses-material-design: true
